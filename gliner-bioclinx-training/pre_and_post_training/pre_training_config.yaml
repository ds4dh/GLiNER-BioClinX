model:
  model_name: "google/mt5-large"
  name: "span level gliner"
  hidden_size: 1024
  max_width: 12
  max_len: 2048
  max_len_tokenizer: null
  max_types: 1000
  max_neg_type_ratio: 1
  dropout: 0.1
  fine_tune: true
  subtoken_pooling: first
  span_mode: markerV0
  fuse_layers: false
  post_fusion_schema: null
  num_rnn_layers: 1
  words_splitter_type: "stanza"

data:
  root_dir: bioclinx-pre_trained-group_by_lang-meta_sampling_true-mult_1
  train_data: "./pre_training_data/train_pre_training_data.json"
  val_data_dir: "./pre_training_data/val_pre_training_data.json"          # set to a .json path to enable F1 checkpointing

# Validation / F1-based checkpointing (used when val_data_dir is set)
eval:
  threshold: 0.5
  batch_size: null              # null → use per_device_train_batch_size
  seed: 42

training:
  prev_path: null
  num_steps: 10000000
  train_batch_size: 8
  eval_every: 5000
  warmup_ratio: 0.0001
  scheduler_type: "cosine"
  num_workers: 4

  # Plain cross-entropy (no focal loss, no masking)
  loss_alpha: -1.0          # disable focal weighting
  loss_gamma: 0.0
  loss_reduction: "mean"
  negatives: 1.0
  masking: "none"

  # Optimiser
  lr_encoder: 1e-5
  lr_others: 5e-5
  weight_decay_encoder: 0.1
  weight_decay_other: 0.01
  max_grad_norm: 1.0

  save_total_limit: 1
  save_safetensors: false   # mt5 has shared weight tensors; use pytorch_model.bin
  early_stopping_patience: 5
  early_stopping_threshold: 0.001

# BatchStrategy (used by train_custom.py)
batch_strategy:
  group_by: "lang"
  meta_sampling: true
  dynamic_max_types_mult: 1  # When null, defaults to 2 (perfect 50% expectation when K > P)
  shuffle_types: true
  seed: 42
